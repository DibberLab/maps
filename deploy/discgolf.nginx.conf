# /etc/nginx/sites-available/discgolf
# The disc golf app (SUBDOMAIN.discjerkers.com): the same site/ and API as Line Fence
# (maps.dibberlab.me); the page sees the discjerkers.com address and shows the disc golf face (site/js/flavor.js).
# setup-discgolf-from-mac.sh fills in SUBDOMAIN.
# nginx serves site/ straight from the git checkout at /var/www/maps.
#
# TLS: *.discjerkers.com is proxied through Cloudflare; the same origin cert as
# discform.discjerkers.com (/etc/ssl/cloudflare/discjerkers.com.pem) covers it.

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMAIN.discjerkers.com;
    return 301 https://SUBDOMAIN.discjerkers.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SUBDOMAIN.discjerkers.com;

    ssl_certificate     /etc/ssl/cloudflare/discjerkers.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/discjerkers.com.key;

    root /var/www/maps/site;
    index index.html;

    # The GPS button needs geolocation. Don't copy budget's
    # "geolocation=()" header here: it would break the button.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No Content-Security-Policy on purpose. If one is ever added, it must
    # allow every host listed in CLAUDE.md, or the map goes blank.

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The app's own files: browsers recheck them on every load (cheap ETag
    # check), so a deploy shows up right away. `expires` keeps the
    # add_header lines above in force, which a location-level add_header
    # would not.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Accounts and sync: the Line Fence API (server/app.py, port 8010).
    # Photos ride inside waypoints, hence the larger body limit.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 25m;
        proxy_read_timeout 60s;
        expires off;
    }

    # Libraries carry their version in the file name and never change.
    location /vendor/ {
        expires 365d;
    }

    location ~ ^/manifest(-dg)?\.json$ {
        default_type application/manifest+json;
        types { }
        expires -1;
    }
}
