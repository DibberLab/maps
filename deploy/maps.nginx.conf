# /etc/nginx/sites-available/maps
# Line Fence (maps.dibberlab.me): one static page, no app server.
# nginx serves site/ straight from the git checkout at /var/www/maps.
#
# TLS: dibberlab.me is proxied through Cloudflare, like budget.dibberlab.me.
# This expects a Cloudflare origin cert at the paths below. setup-from-mac.sh
# links an existing *.dibberlab.me cert here if there is one, or stops and
# says how to make one.

server {
    listen 80;
    listen [::]:80;
    server_name maps.dibberlab.me;
    return 301 https://maps.dibberlab.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maps.dibberlab.me;

    ssl_certificate     /etc/ssl/cloudflare/maps.dibberlab.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/maps.dibberlab.me.key;

    root /var/www/maps/site;
    index index.html;

    # The GPS button needs geolocation. Don't copy budget's
    # "geolocation=()" header here: it would break the button.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No Content-Security-Policy on purpose. If one is ever added, it must
    # allow every host listed in CLAUDE.md, or the map goes blank.

    gzip on;
    gzip_types text/css application/javascript;   # text/html is always gzipped

    # One file; browsers recheck it so a deploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
