<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Line Fence</title>
<meta name="description" content="Free property line and public land map for Wisconsin and Minnesota.">
<meta name="theme-color" content="#1f2b24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line Fence">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="bar">
  <div class="brand">Line<span>·</span>Fence</div>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="Address, town, or 45.78, -92.38" autocomplete="off" aria-label="Search">
    <button type="submit">Go</button>
  </form>
  <button class="iconbtn" id="locate" title="Show my location" aria-label="Show my location">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div class="chip" id="zoomHint">Zoom in to see property lines</div>

<button class="iconbtn fab" id="layersBtn" aria-label="Layers" aria-expanded="false">
  <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg>
</button>

<div class="layers" id="layersPanel" hidden>
  <h3>Base map</h3>
  <label class="opt"><input type="radio" name="base" id="b-hyb" value="hyb" checked> Aerial + roads (USGS)</label>
  <label class="opt"><input type="radio" name="base" id="b-img" value="img"> Aerial only (USGS)</label>
  <label class="opt"><input type="radio" name="base" id="b-topo" value="topo"> Topo (USGS)</label>
  <label class="opt"><input type="radio" name="base" id="b-osm" value="osm"> Streets (OpenStreetMap)</label>
  <h3>Private land</h3>
  <label class="opt"><input type="checkbox" id="l-parcels" checked><span class="sw" style="border:2px solid var(--parcel);background:transparent"></span> Property lines &amp; owners</label>
  <label class="opt"><input type="checkbox" id="l-mncov" checked><span class="sw" style="background:repeating-linear-gradient(45deg,#777 0 3px,transparent 3px 6px)"></span> MN counties without free data</label>
  <h3>Public land</h3>
  <label class="opt"><input type="checkbox" id="l-padus" checked><span class="sw" style="background:var(--open)"></span> All public land by access (USGS PAD-US)</label>
  <label class="opt"><input type="checkbox" id="l-widnr" checked><span class="sw" style="background:#2f7d8c"></span> WI DNR lands</label>
  <label class="opt"><input type="checkbox" id="l-wiclosed"><span class="sw" style="background:#b33"></span> WI closed &amp; restricted areas, refuges</label>
  <label class="opt"><input type="checkbox" id="l-wimfl"><span class="sw" style="background:#6a8f2f"></span> WI MFL/FCL private forest open to public</label>
  <label class="opt"><input type="checkbox" id="l-mndnr" checked><span class="sw" style="background:#8a6bb8"></span> MN public hunting &amp; open space</label>
  <p class="small">Tap anywhere on the map to see who owns it and what access applies.</p>

  <div id="installBox" hidden>
    <h3>App</h3>
    <button class="btn" id="installBtn" type="button" hidden>Install Line Fence on this device</button>
    <p class="small" id="iosHint" hidden>To install on iPhone or iPad: tap Share <span aria-hidden="true">⎙</span>, then <b>Add to Home Screen</b>.</p>
  </div>

  <h3>Your data</h3>
  <p class="small" id="dataNote">Settings and saved items stay on this device.</p>
  <div class="btnrow">
    <button class="btn" id="backupBtn" type="button">Back up</button>
    <label class="btn" for="restoreFile">Restore</label>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-live="polite">
  <div class="grab"></div>
  <header>
    <div id="sheetHead"></div>
    <div class="sheetbtns">
      <button class="close" id="shareBtn" aria-label="Share this spot" title="Share this spot">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg>
      </button>
      <button class="close" id="closeSheet" aria-label="Close">✕</button>
    </div>
  </header>
  <div id="sheetBody"></div>
</section>

<script src="vendor/leaflet-1.9.4.js"></script>
<script src="vendor/esri-leaflet-3.0.12.js"></script>
<script src="js/store.js"></script>
<script src="js/share.js"></script>
<script src="js/map.js"></script>
<script src="js/identify.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
